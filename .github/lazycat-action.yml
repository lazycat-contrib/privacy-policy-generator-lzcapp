version: 1

project:
  root: .
  build_config: lzc-build.yml
  package_file: package.yml
  output: dist/privacy-policy-generator.lpk
  target_arch: amd64

update:
  strategy: publish
  allow_downgrade: false
  version_source:
    type: image
    image: app

build:
  run_buildscript: false

images:
  - id: app
    target: service
    service: app
    source: ghcr.io/dockers-x/privacy-policy-generator
    channel: stable
    sort: semver
    tag_regex: '^\d+\.\d+\.\d+$'
    delivery:
      mode: mirror
      require_digest_match: true

stores:
  official:
    enabled: false
  private:
    enabled: true
    skip_if_version_exists: true
    name: Privacy Policy Generator
    summary: "移动应用隐私政策与服务条款生成器"
