application:
  subdomain: privacy-policy
  background_task: false
  multi_instance: false
  public_path:
    - /
  upstreams:
    - location: /
      backend: http://app:8080/
services:
  app:
    # upstream: ghcr.io/dockers-x/privacy-policy-generator:5.2.0
    image: ghcr.nju.edu.cn/dockers-x/privacy-policy-generator:5.2.0
    environment:
      - TZ=Asia/Shanghai
    healthcheck:
      test:
        - CMD
        - wget
        - -q
        - -O
        - /dev/null
        - http://127.0.0.1:8080/healthz
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 5s
